<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cliente — Nexo ERP</title>
  <meta name="description" content="Crie sua conta de cliente no Nexo ERP e comece a fazer pedidos online para o comércio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/demo.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M10 22V10l12 12V10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    .cad-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 60px 20px;
      background:
        radial-gradient(800px 400px at 80% -10%, rgba(37, 99, 235, .14), transparent 60%),
        radial-gradient(600px 400px at 0% 100%, rgba(13, 148, 136, .10), transparent 60%),
        var(--bg);
    }
    .cad-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      padding: 40px 36px;
    }
    .cad-card .logo { justify-content: center; margin-bottom: 14px; }
    .cad-card h1 { text-align: center; font-size: 1.45rem; margin-bottom: 6px; }
    .cad-card > p { text-align: center; color: var(--muted); font-size: .92rem; margin-bottom: 28px; }
    .cad-form { display: grid; gap: 16px; }
    .cad-form .btn { width: 100%; margin-top: 6px; }
    .cad-links { text-align: center; margin-top: 20px; font-size: .86rem; color: var(--muted); }
    .cad-links a { color: var(--primary); font-weight: 600; }
    .cad-success { display: none; text-align: center; }
    .cad-success h2 { margin-bottom: 8px; }
    .cad-success p { color: var(--muted); font-size: .92rem; margin-bottom: 22px; }
  </style>
</head>
<body>

  <div class="cad-wrap">
    <div class="cad-card">

      <div id="cadFormBox">
        <a href="index.html" class="logo">
          <span class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18V6l12 12V6"/></svg>
          </span>
          <span>Nexo<em>ERP</em></span>
        </a>
        <h1>Crie sua conta de cliente</h1>
        <p>Cadastre-se para consultar produtos e fazer pedidos direto pelo sistema.</p>

        <form class="cad-form" id="cadForm">
          <div class="demo-field">
            <label for="cadNome">Nome completo</label>
            <input type="text" id="cadNome" placeholder="Ex.: Maria Oliveira" required>
          </div>
          <div class="demo-field">
            <label for="cadEmail">E-mail</label>
            <input type="email" id="cadEmail" placeholder="voce@email.com" required>
          </div>
          <div class="demo-field">
            <label for="cadTelefone">Telefone / WhatsApp</label>
            <input type="tel" id="cadTelefone" placeholder="(11) 90000-0000">
          </div>
          <div class="demo-field">
            <label for="cadSenha">Senha</label>
            <input type="password" id="cadSenha" minlength="6" placeholder="Mínimo de 6 caracteres" required>
          </div>
          <button type="submit" class="btn btn-primary">
            Cadastrar e acessar o sistema
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <p class="cad-links">Já tem conta? <a href="demo.html">Acesse o sistema</a> · <a href="index.html">Voltar ao site</a></p>
      </div>

      <div class="cad-success" id="cadSuccess">
        <span class="logo-mark" style="margin:0 auto 18px;width:56px;height:56px;border-radius:16px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;"><path d="M20 7L9 18l-5-5"/></svg>
        </span>
        <h2>Cadastro realizado!</h2>
        <p>Sua conta de cliente foi criada. Entre com seu e-mail e senha para fazer seu primeiro pedido.</p>
        <a href="demo.html" class="btn btn-primary" style="width:100%;">Ir para o acesso</a>
      </div>

    </div>
  </div>

  <script>
    /* Cadastro de cliente — persiste no mesmo localStorage da demo */
    (function () {
      'use strict';
      var KEY = 'nexoDemoStateV2';
      function load() {
        try { var s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
        return null;
      }
      function save(st) { localStorage.setItem(KEY, JSON.stringify(st)); }

      document.getElementById('cadForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var nome = document.getElementById('cadNome').value.trim();
        var email = document.getElementById('cadEmail').value.trim().toLowerCase();
        var telefone = document.getElementById('cadTelefone').value.trim();
        var senha = document.getElementById('cadSenha').value;

        var st = load();
        if (st && st.users) {
          if (st.users.some(function (u) { return u.email === email; })) {
            alert('Já existe uma conta com este e-mail. Tente fazer login.');
            return;
          }
          st.users.push({ id: Date.now(), nome: nome, email: email, senha: senha,
                          telefone: telefone, perfil: 'cliente', ativo: true });
          st.auditoria.push({ data: new Date().toLocaleString('pt-BR'), usuario: nome,
                              acao: 'CADASTRO_CLIENTE', detalhe: 'Novo cliente cadastrado pelo site' });
          save(st);
        }
        document.getElementById('cadFormBox').style.display = 'none';
        document.getElementById('cadSuccess').style.display = 'block';
      });
    })();
  </script>
</body>
</html>
